<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Multitool Menu</title>
  <meta name="description" content="A nav menu whose links swing out from a rivet on the button, like blades on a pocket tool.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="/demo/site.css">
</head>
<body class="alder">
  <div class="site" id="site">
    <header class="nav">
      <a class="mark" href="/"><i></i>Alder</a>
      <multitool-menu label="Menu">
        <a href="#work">Work</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#journal">Journal</a>
        <a href="#contact">Contact</a>
      </multitool-menu>
    </header>
    <main class="hero">
      <div class="hero-copy" id="copy">
        <div class="eyebrow">Furniture workshop in Porto</div>
        <h1 class="h" id="h">Furniture for small rooms. <span>Made to order in oak and folded steel.</span></h1>
        <div class="actions">
          <a class="cta" href="#contact" data-page="#contact">Start a commission</a>
          <a class="link" href="#work" data-page="#work">See the work <span>→</span></a>
        </div>
      </div>
      <div class="note"><b>Next opening: March 2027</b>Four commissions a season</div>
    </main>
  </div>
  <a class="pg-link" href="/playground">Multitool Menu demo · Open the playground →</a>
  <script type="module" src="/demo/demo.ts"></script>
</body>
</html>
